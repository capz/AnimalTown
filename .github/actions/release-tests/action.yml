name: Release tests
description: Run selected host checks and Dolphin smoke tests against a single console candidate
inputs:
  full-pipeline:
    description: Run the selected host checks and build a console test candidate
    default: 'false'
  host-checks:
    description: Run selected host checks when no console candidate is needed
    default: 'false'
  policy:
    description: Run version and release policy checks
    default: 'true'
  version:
    description: Version stamped into the console candidate
    required: false
  commit:
    description: Release commit identifier for diagnostic artifact names
    required: false
  build-image:
    description: Pinned Linux builder image for the console candidate
    required: false
runs:
  using: composite
  steps:
    - name: Check version and validation policy
      if: inputs.policy == 'true'
      shell: pwsh
      run: |
        ./tests/versioning.ps1
        ./tests/validation-plan.ps1
        ./tests/validation-selection.ps1
        ./tests/release-publish.ps1
    - name: Check release bundle and source archive policy
      if: inputs.policy == 'true'
      shell: bash
      run: python3 tests/release-bundle.py
    - name: Read selected release checks
      id: selection
      if: inputs.full-pipeline == 'true' || inputs.host-checks == 'true'
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        plan=json.loads(Path('out/validation-plan.json').read_text())
        individual={'title-logo':'title_logo','video-options':'video_options','save-and-quit':'save_quit',
                    'terrain-materials':'terrain_materials','daylight':'daylight','villager-visuals':'villager_visuals','online-play':'online_play'}
        card_modes=('slot-b','choose-b','without-saving','no-card')
        job_modes=('delivery','mail','helipad','online-review')
        allowed=set(individual)|{f'card-{mode}' for mode in card_modes}|{f'job-{mode}' for mode in job_modes}
        selected=plan.get('emulator')
        if plan.get('schema')!=3 or not isinstance(selected,list) or not all(isinstance(name,str) for name in selected):
            raise SystemExit('Expected validation plan schema 3 with an emulator array')
        scenarios=set(selected)
        if len(scenarios)!=len(selected) or scenarios-allowed:
            raise SystemExit('Validation plan contains duplicate or unknown emulator scenarios')
        outputs={key:str(name in scenarios).lower() for name,key in individual.items()}
        outputs['dolphin']=str(bool(scenarios)).lower()
        outputs['cards']=' '.join(mode for mode in card_modes if f'card-{mode}' in scenarios)
        outputs['jobs']=' '.join(mode for mode in job_modes if f'job-{mode}' in scenarios)
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            for key,value in outputs.items():
                output.write(f'{key}={value}\n')
        PY
    - name: Check helipad art matches the game's polygons
      if: inputs.policy == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: python3 tools/helipad-vector.py --check
    - name: Run selected host checks without a console candidate
      if: inputs.host-checks == 'true' && inputs.full-pipeline != 'true'
      env:
        ANIMALTOWN_BUILD_IMAGE: ${{ inputs.build-image }}
      shell: bash
      run: |
        compose=(docker compose -f build/compose.yml run --rm --pull always)
        if [ "$(jq -r '.backend' out/validation-plan.json)" != true ]; then
          compose+=(--no-deps)
        fi
        "${compose[@]}" builder pwsh -NoLogo -NoProfile -File tools/build-linux.ps1 -Target checks
    - name: Run selected checks and prepare the console test candidate
      id: candidate
      if: inputs.full-pipeline == 'true'
      env:
        ANIMALTOWN_BUILD_IMAGE: ${{ inputs.build-image }}
      shell: bash
      run: |
        # Target tests runs the planned host suites and builds the release candidate.
        # Package admission and LOD audits still use the actual cooked data.
        if [ "$(jq -r '.backend' out/validation-plan.json)" = true ]; then
          docker compose -f build/compose.yml run --rm --pull always builder pwsh -NoLogo -NoProfile -File tools/build-linux.ps1 -Target tests
        else
          docker compose -f build/compose.yml run --rm --pull always --no-deps builder pwsh -NoLogo -NoProfile -File tools/build-linux.ps1 -Target tests
        fi
        python3 - <<'PY'
        import json
        from pathlib import Path
        root=Path('out');version=json.loads((root/'version.json').read_text())['version']
        expected=f'AnimalTown-{version}.nkit.iso'
        assert sorted(p.name for p in root.glob('*.iso'))==[expected], 'Console build must retain only its NKit ISO'
        depot=root/f'AnimalTown-{version}-depot.zip'
        assert depot.is_file() and depot.stat().st_size>0, 'Standalone Depot runtime package is missing'
        assert not any((root/'disc-work').rglob('*.iso')), 'Temporary source ISO was not removed'
        assert not any((root/'nkit-work').rglob('*.iso')), 'Temporary round-trip ISO was not removed'
        PY
    - name: Verify visual residency validation evidence
      if: steps.candidate.outcome == 'success'
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        root=Path('out')
        species={'fox','bunny','giraffe','cat','hamster','spaniel'}
        lod=json.loads((root/'model-lod-audit.json').read_text())
        memory=json.loads((root/'model-memory-audit.json').read_text())
        native=[json.loads(line) for line in (root/'model-native-peak-audit.jsonl').read_text().splitlines() if line]
        assert lod['eligibilityEnforced'], 'Candidate used an exploratory LOD cook instead of the release gate'
        assert {row['species'] for row in lod['models']}==species, 'Missing cooked LOD evidence'
        assert all(row['report']['Triangles']<=row['report']['SourceTriangles']*(1-lod['minimumTriangleReduction']) for row in lod['models'] if row['runtimeEligible']), 'An enabled geometric LOD missed its measured useful-reduction gate'
        assert {row['species'] for row in memory['model']}==species, 'Missing startup admission bounds'
        poses=[row for row in native if row['kind']=='animatedCorrespondence']
        assert len(poses)==6, 'Missing native pose correspondence checks'
        assert all(row['animatedMaximumNormalizedError']<=row['maximumAllowedNormalizedError']+1e-6 for row in poses), 'LOD animation exceeded its sampled error budget'
        assert len([row for row in native if row['kind']=='selectedStartup'])==6, 'Missing selected-player startup allocation checks'
        assert (root/'disc/villager-memory.bin').stat().st_size==160, 'Unexpected startup memory catalog'
        PY
    - name: Keep visual residency validation diagnostics
      if: always() && steps.candidate.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: visual-residency-${{ inputs.commit }}
        path: |
          out/model-lod-audit.json
          out/model-memory-audit.json
          out/model-native-peak-audit.jsonl
        if-no-files-found: error
    - name: Build the shared Dolphin test image
      id: dolphin
      if: ${{ !cancelled() && steps.candidate.outcome == 'success' && steps.selection.outputs.dolphin == 'true' }}
      shell: bash
      run: timeout --kill-after=30s 15m docker build -t animaltown-dolphin-test -f build/Dockerfile.dolphin build
    - name: Verify villager visual swaps in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.villager_visuals == 'true' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        mkdir -p out/villager-visuals
        timeout --kill-after=30s 15m docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
          --mount "type=bind,src=$PWD,dst=/work" -w /work \
          animaltown-dolphin-test python3 tools/iso-smoke.py \
          "out/AnimalTown-$BUILD_VERSION.nkit.iso" out/villager-visuals --villager-visuals
        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path
        identity=json.loads(Path('out/version.json').read_text())
        disc=Path('out')/f"AnimalTown-{identity['version']}.nkit.iso"
        with disc.open('rb') as source:
            digest=hashlib.file_digest(source,'sha256').hexdigest()
        evidence={'schema':1,'commit':identity['commit'],'version':identity['version'],
                  'tag':identity['tag'],'isoName':disc.name,'isoSha256':digest}
        Path('out/villager-visuals/villager-visuals-build.json').write_text(json.dumps(evidence,indent=2)+'\n')
        PY
    - name: Keep villager visual swap diagnostics
      if: always() && steps.selection.outputs.villager_visuals == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: villager-visuals-${{ inputs.commit }}
        path: |
          out/villager-visuals/*.png
          out/villager-visuals/*.json
          out/villager-visuals/*.log
          out/villager-visuals/user/Logs/
        if-no-files-found: ignore
    - name: Capture and verify title branding in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.title_logo == 'true' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        timeout --kill-after=30s 15m bash -e -o pipefail <<'SCENARIO'
        mkdir -p out/title-logo
        docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
          --mount "type=bind,src=$PWD,dst=/work" -w /work \
          animaltown-dolphin-test python3 tools/iso-smoke.py \
          "out/AnimalTown-$BUILD_VERSION.nkit.iso" out/title-logo --title-logo
        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path
        identity=json.loads(Path('out/version.json').read_text())
        disc=Path('out')/f"AnimalTown-{identity['version']}.nkit.iso"
        with disc.open('rb') as source:
            digest=hashlib.file_digest(source,'sha256').hexdigest()
        evidence={'schema':1,'commit':identity['commit'],'version':identity['version'],
                  'tag':identity['tag'],'isoName':disc.name,'isoSha256':digest}
        Path('out/title-logo/title-logo-build.json').write_text(json.dumps(evidence,indent=2)+'\n')
        PY
        SCENARIO
    - name: Keep title-logo capture diagnostics
      if: always() && steps.dolphin.outcome == 'success' && steps.selection.outputs.title_logo == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: title-logo-${{ inputs.commit }}
        path: |
          out/title-logo/*.png
          out/title-logo/*.json
          out/title-logo/*.log
          out/title-logo/*.txt
          out/title-logo/user/Logs/
        if-no-files-found: warn
    - name: Verify video options, smoothing persistence and deletion controls in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.video_options == 'true' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        timeout --kill-after=30s 20m bash -e -o pipefail <<'SCENARIO'
        mkdir -p out/video-options/smoothing out/video-options/options out/video-options/unsupported
        run_options() {
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/work" -w /work \
            animaltown-dolphin-test python3 tools/iso-smoke.py \
            "out/AnimalTown-$BUILD_VERSION.nkit.iso" "$@" --dsp-hle --season spring
        }
        run_options out/video-options/smoothing --full-resolution-aa --component-cable
        cp out/video-options/smoothing/MemoryCardA.USA.raw out/video-options/options/MemoryCardA.USA.raw
        run_options out/video-options/options --title-options --component-cable
        run_options out/video-options/options --title-options-load --component-cable
        run_options out/video-options/unsupported --title-options-unsupported
        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path
        identity=json.loads(Path('out/version.json').read_text())
        disc=Path('out')/f"AnimalTown-{identity['version']}.nkit.iso"
        with disc.open('rb') as source: digest=hashlib.file_digest(source,'sha256').hexdigest()
        evidence={'schema':1,'commit':identity['commit'],'version':identity['version'],
                  'tag':identity['tag'],'isoName':disc.name,'isoSha256':digest}
        Path('out/video-options/video-options-build.json').write_text(json.dumps(evidence,indent=2)+'\n')
        PY
        SCENARIO
    - name: Keep video-options capture diagnostics
      if: always() && steps.dolphin.outcome == 'success' && steps.selection.outputs.video_options == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: video-options-${{ inputs.commit }}
        path: |
          out/video-options/*.json
          out/video-options/*/*.png
          out/video-options/*/*.json
          out/video-options/*/*.log
          out/video-options/*/user/Logs/
        if-no-files-found: warn
    - name: Verify Save & Quit and reloading the town in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.save_quit == 'true' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        timeout --kill-after=30s 12m bash -e -o pipefail <<'SCENARIO'
        mkdir -p out/save-and-quit
        docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
          --mount "type=bind,src=$PWD,dst=/work" -w /work \
          animaltown-dolphin-test python3 tools/iso-smoke.py \
          "out/AnimalTown-$BUILD_VERSION.nkit.iso" out/save-and-quit --save-and-quit
        SCENARIO
    - name: Keep Save & Quit diagnostics
      if: always() && steps.dolphin.outcome == 'success' && steps.selection.outputs.save_quit == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: save-and-quit-${{ inputs.commit }}
        path: |
          out/save-and-quit/*.json
          out/save-and-quit/*.png
          out/save-and-quit/*.log
          out/save-and-quit/user/Logs/
        if-no-files-found: warn
    - name: Capture terrain mip bands and water animation in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.terrain_materials == 'true' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        timeout --kill-after=30s 25m bash -e -o pipefail <<'SCENARIO'
        mkdir -p out/terrain-materials
        docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
          --mount "type=bind,src=$PWD,dst=/work" -w /work \
          animaltown-dolphin-test python3 tools/iso-smoke.py \
          "out/AnimalTown-$BUILD_VERSION.nkit.iso" out/terrain-materials --terrain-materials --season spring --dsp-hle
        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path
        identity=json.loads(Path('out/version.json').read_text())
        disc=Path('out')/f"AnimalTown-{identity['version']}.nkit.iso"
        with disc.open('rb') as source:
            digest=hashlib.file_digest(source,'sha256').hexdigest()
        evidence={'schema':1,'commit':identity['commit'],'version':identity['version'],
                  'tag':identity['tag'],'isoName':disc.name,'isoSha256':digest}
        Path('out/terrain-materials/terrain-materials-build.json').write_text(json.dumps(evidence,indent=2)+'\n')
        PY
        SCENARIO
    - name: Keep terrain-material capture diagnostics
      if: always() && steps.dolphin.outcome == 'success' && steps.selection.outputs.terrain_materials == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: terrain-materials-${{ inputs.commit }}
        path: |
          out/terrain-materials/*.png
          out/terrain-materials/*.json
          out/terrain-materials/*.log
          out/terrain-materials/*.txt
          out/terrain-materials/user/Logs/
        if-no-files-found: warn
    - name: Verify memory-card selection and temporary play in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.cards != '' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
        CARD_SCENARIOS: ${{ steps.selection.outputs.cards }}
      shell: bash
      run: |
        timeout --kill-after=30s 20m bash -e -o pipefail <<'SCENARIO'
        read -r -a scenarios <<< "$CARD_SCENARIOS"
        for scenario in "${scenarios[@]}"; do
          mkdir -p "out/memory-cards/$scenario"
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/work" -w /work \
            animaltown-dolphin-test python3 tools/iso-smoke.py \
            "out/AnimalTown-$BUILD_VERSION.nkit.iso" "out/memory-cards/$scenario" \
            --save-cards "$scenario" --season spring --dsp-hle
        done
        SCENARIO
    - name: Keep memory-card capture diagnostics
      if: always() && steps.dolphin.outcome == 'success' && steps.selection.outputs.cards != ''
      uses: actions/upload-artifact@v4
      with:
        name: memory-cards-${{ inputs.commit }}
        path: |
          out/memory-cards/*/*.png
          out/memory-cards/*/*.json
          out/memory-cards/*/*.log
          out/memory-cards/*/*.txt
          out/memory-cards/*/user/Logs/
        if-no-files-found: warn
    - name: Verify day, dawn, dusk and night lighting in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.daylight == 'true' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        timeout --kill-after=30s 20m bash -e -o pipefail <<'SCENARIO'
        for phase in noon dawn dusk night; do
          case "$phase" in noon) capture_clock=12:00 ;; dawn) capture_clock=06:30 ;; dusk) capture_clock=18:00 ;; night) capture_clock=20:00 ;; esac
          mkdir -p "out/daylight/$phase"
          if [ "$phase" != noon ]; then cp out/daylight/noon/MemoryCardA.USA.raw "out/daylight/$phase/MemoryCardA.USA.raw"; fi
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/work" -w /work \
            animaltown-dolphin-test python3 tools/iso-smoke.py \
            "out/AnimalTown-$BUILD_VERSION.nkit.iso" "out/daylight/$phase" \
            --daylight-clock "$capture_clock" --season spring --dsp-hle
        done
        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path
        identity=json.loads(Path('out/version.json').read_text())
        disc=Path('out')/f"AnimalTown-{identity['version']}.nkit.iso"
        with disc.open('rb') as source: digest=hashlib.file_digest(source,'sha256').hexdigest()
        evidence={'schema':1,'commit':identity['commit'],'version':identity['version'],
                  'tag':identity['tag'],'isoName':disc.name,'isoSha256':digest}
        Path('out/daylight/daylight-build.json').write_text(json.dumps(evidence,indent=2)+'\n')
        PY
        SCENARIO
    - name: Keep daylight transition diagnostics
      if: always() && steps.dolphin.outcome == 'success' && steps.selection.outputs.daylight == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: daylight-${{ inputs.commit }}
        path: |
          out/daylight/*.json
          out/daylight/*/*.png
          out/daylight/*/*.json
          out/daylight/*/*.log
          out/daylight/*/user/Logs/
        if-no-files-found: warn
    - name: Verify actual job controls and committed results in Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.jobs != '' }}
      env:
        BUILD_VERSION: ${{ inputs.version }}
        JOB_MODES: ${{ steps.selection.outputs.jobs }}
        ANIMALTOWN_BUILD_IMAGE: ${{ inputs.build-image }}
      shell: bash
      run: |
        timeout --kill-after=30s 30m bash -e -o pipefail <<'SCENARIO'
        mkdir -p out/jobs/template
        docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
          --mount "type=bind,src=$PWD,dst=/work" -w /work \
          animaltown-dolphin-test python3 tools/iso-smoke.py \
          "out/AnimalTown-$BUILD_VERSION.nkit.iso" out/jobs/template --jobs template --season summer --dsp-hle --component-cable
        read -r -a modes <<< "$JOB_MODES"
        for mode in "${modes[@]}"; do
          docker compose -f build/compose.yml run --rm --no-deps builder \
            dotnet run --project tests/AnimalTown.Checks -c Release -- --job-fixture "out/job-fixtures/$mode" "$mode"
          python3 tools/profile-card-fixture.py out/jobs/template/MemoryCardA.USA.raw \
            "out/job-fixtures/$mode" "out/jobs/$mode/MemoryCardA.USA.raw"
          if [ "$mode" = helipad ]; then
            python3 tools/profile-card-fixture.py out/jobs/template/MemoryCardA.USA.raw \
              out/job-fixtures/helipad-destination out/jobs/helipad/MemoryCardB.USA.raw
          fi
          if [ "$mode" = online-review ]; then
            docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$PWD,dst=/work" -w /work \
              animaltown-dolphin-test python3 tools/iso-smoke.py \
              "out/AnimalTown-$BUILD_VERSION.nkit.iso" "out/jobs/$mode" --online-review --season summer --dsp-hle --component-cable
            continue
          fi
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/work" -w /work \
            animaltown-dolphin-test python3 tools/iso-smoke.py \
            "out/AnimalTown-$BUILD_VERSION.nkit.iso" "out/jobs/$mode" --jobs "$mode" --season summer --dsp-hle --component-cable
          docker compose -f build/compose.yml run --rm --no-deps builder \
            dotnet run --project tests/AnimalTown.Checks -c Release -- --job-verify "out/jobs/$mode/records" "$mode"
        done
        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path
        identity=json.loads(Path('out/version.json').read_text());disc=Path('out')/f"AnimalTown-{identity['version']}.nkit.iso"
        with disc.open('rb') as source:digest=hashlib.file_digest(source,'sha256').hexdigest()
        evidence={'schema':1,'commit':identity['commit'],'version':identity['version'],'tag':identity['tag'],'isoName':disc.name,'isoSha256':digest}
        Path('out/jobs/jobs-build.json').write_text(json.dumps(evidence,indent=2)+'\n')
        PY
        SCENARIO
    - name: Keep offline job controller diagnostics
      if: always() && steps.dolphin.outcome == 'success' && steps.selection.outputs.jobs != ''
      uses: actions/upload-artifact@v4
      with:
        name: offline-jobs-${{ inputs.commit }}
        path: |
          out/jobs/*.json
          out/jobs/*/*.json
          out/jobs/*/*.png
          out/jobs/*/*.log
          out/jobs/*/user/Logs/
        if-no-files-found: warn
    - uses: actions/setup-dotnet@v4
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.online_play == 'true' }}
      with:
        global-json-file: global.json
    - name: Qualify real GameCube SDK HTTPS and WSS on Dolphin
      if: ${{ !cancelled() && steps.dolphin.outcome == 'success' && steps.selection.outputs.online_play == 'true' }}
      shell: pwsh
      env:
        BUILD_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: ./tests/server-integration.ps1 -PublicTunnel -DolphinIso "out/AnimalTown-$env:BUILD_VERSION.nkit.iso"
    - name: Keep redacted online Dolphin evidence
      if: always() && steps.selection.outputs.online_play == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: online-dolphin-${{ inputs.commit }}
        path: |
          out/online-dolphin/*.json
          out/online-dolphin/*.log
          out/online-dolphin/emulator/*.json
          out/online-dolphin/emulator/*.png
          out/online-dolphin/emulator/*.log
          out/online-dolphin/emulator/*.txt
        if-no-files-found: warn
