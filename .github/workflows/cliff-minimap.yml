name: Cliff shadows and running minimap
on:
  push:
    branches: [feat/cliff-shadows-running-minimap]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cliff-hud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dolphin:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve matching release identity
        id: version
        shell: pwsh
        run: ./tools/write-version.ps1 -GitHubOutput $env:GITHUB_OUTPUT
      - name: Prepare emulator
        run: |
          docker build -t animaltown-hud - <<'DOCKER'
          FROM debian:trixie
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb xauth ffmpeg python3 libxcb-cursor0 ca-certificates && rm -rf /var/lib/apt/lists/*
          DOCKER
      - name: Fetch and verify the matching NKit ISO
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out/hud-release
          for attempt in $(seq 1 70); do
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out/hud-release --clobber --pattern "AnimalTown-$VERSION.nkit.iso" --pattern version.json --pattern SHA256SUMS.txt; then break; fi
            test "$attempt" != 70
            sleep 15
          done
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('out/hud-release');meta=json.loads((root/'version.json').read_text())
          assert meta['commit']==os.environ['GITHUB_SHA'] and not meta['dirty']
          name='AnimalTown-'+meta['version']+'.nkit.iso';iso=root/name
          assert 0<iso.stat().st_size<1459978240
          with iso.open('rb') as f: header=f.read(0x214)
          assert header[0x200:0x208]==b'NKIT v01' and int.from_bytes(header[0x210:0x214],'big')==1459978240
          expected=next(s.split()[0] for s in (root/'SHA256SUMS.txt').read_text().splitlines() if s.split()[-1].lstrip('*')==name)
          h=hashlib.sha256()
          with iso.open('rb') as f:
              while b:=f.read(8*1024*1024):h.update(b)
          assert h.hexdigest().lower()==expected.lower()
          Path('out/hud-iso.txt').write_text(str(iso))
          PY
      - name: Inspect HUD timing and cliff shadows in Dolphin
        run: |
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" -e LIBGL_ALWAYS_SOFTWARE=1 --mount type=bind,src="$PWD",dst=/work -w /work animaltown-hud python3 tools/iso-smoke.py "$(cat out/hud-iso.txt)" out/cliff-hud --cliff-minimap
      - name: Publish visual evidence
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,hashlib
          root=Path('out/hud-evidence');root.mkdir(parents=True,exist_ok=True)
          for p in Path('out/cliff-hud').glob('*'):
              if p.suffix in ['.png','.txt'] or p.name=='emulator.log':shutil.copy2(p,root/('cliff-hud-'+p.name))
          lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(root.iterdir())]
          (root/'cliff-hud-SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
          if [ -n "$TAG" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" out/hud-evidence/* --clobber; fi
