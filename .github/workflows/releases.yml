name: Build and release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  ANIMALTOWN_VERSION_BUILD_KIND: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'main' || 'branch' }}
  ANIMALTOWN_VERSION_MAIN_REF: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.sha || 'refs/remotes/origin/main' }}

jobs:
  version-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin current main history
        run: git fetch origin main
      - name: Check version and validation policy
        shell: pwsh
        run: |
          ./tests/versioning.ps1
          ./tests/validation-plan.ps1
      - name: Resolve main version and actual source identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/write-version.ps1 -Refresh

  release:
    needs: version-policy
    # Forks run the read-only policy checks; publishing uses same-repository code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin current main history
        run: git fetch origin main
      - name: Resolve incremental main or branch build version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/write-version.ps1 -Refresh -GitHubOutput $env:GITHUB_OUTPUT
          $identity=Get-Content out/version.json -Raw|ConvertFrom-Json
          if(!$identity.canPublish){throw 'Main release must end at a merged PR boundary; refresh GitHub merge metadata or merge through a PR'}
      - name: Select checks and publish every merged PR
        id: validation
        shell: pwsh
        run: ./tools/select-validation.ps1 -ForceRelease -Full:($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') -GitHubOutput $env:GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish Linux toolchain image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./build
          file: ./build/Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          provenance: false
          tags: ghcr.io/capz/animaltown-build:${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Build ISO/backend, run selected checks and package
        env:
          ANIMALTOWN_BUILD_IMAGE: ghcr.io/capz/animaltown-build@${{ steps.image.outputs.digest }}
        run: |
          if [ "$(jq -r '.backend' out/validation-plan.json)" = true ]; then
            docker compose -f build/compose.yml run --rm --pull always builder
          else
            docker compose -f build/compose.yml run --rm --pull always --no-deps builder
          fi
      - name: Package and publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ANIMALTOWN_BUILD_IMAGE: ghcr.io/capz/animaltown-build@${{ steps.image.outputs.digest }}
        run: docker compose -f build/compose.yml run --rm --pull always --no-deps -e GH_TOKEN builder pwsh -NoLogo -NoProfile -File tools/build-linux.ps1 -Target publish
      - name: Stop disposable test database
        if: always()
        run: docker compose -f build/compose.yml down --volumes --remove-orphans
