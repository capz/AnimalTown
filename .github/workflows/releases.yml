name: Build and release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANIMALTOWN_VERSION_BUILD_KIND: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'main' || 'branch' }}
  ANIMALTOWN_VERSION_MAIN_REF: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.sha || 'refs/remotes/origin/main' }}

jobs:
  fork-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Tests
        uses: ./.github/actions/release-tests
      - name: Resolve main version and actual source identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/write-version.ps1 -Refresh

  pipeline:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      packages: write
      pull-requests: read
    runs-on: ubuntu-24.04
    # Full console builds plus all selected Dolphin tours need headroom beyond
    # the ~80-minute run that exited the terrain tour early.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Pin current main history
        run: git fetch origin main
      - name: Resolve incremental main or branch build version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/write-version.ps1 -Refresh -GitHubOutput $env:GITHUB_OUTPUT
          $identity=Get-Content out/version.json -Raw|ConvertFrom-Json
          if(!$identity.canPublish){throw 'Main release must end at a merged PR boundary; refresh GitHub merge metadata or merge through a PR'}
      - name: Select validation and release scope
        id: validation
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $base=''
          if($env:GITHUB_EVENT_NAME -eq 'pull_request'){
            $base=(& git merge-base HEAD $env:PR_BASE).Trim()
            if($LASTEXITCODE){throw 'Cannot determine PR comparison base'}
          }
          ./tools/select-validation.ps1 -BaseRef $base -ForceRelease:($env:GITHUB_EVENT_NAME -ne 'pull_request') -Full:($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') -GitHubOutput $env:GITHUB_OUTPUT -SkipPolicyChecks
      - uses: docker/setup-buildx-action@v3
        if: steps.validation.outputs.release == 'true' || steps.validation.outputs.checks == 'true'
      - uses: docker/login-action@v3
        if: steps.validation.outputs.release == 'true' || steps.validation.outputs.checks == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish Linux toolchain image
        if: steps.validation.outputs.release == 'true' || steps.validation.outputs.checks == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./build
          file: ./build/Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          provenance: false
          tags: ghcr.io/capz/animaltown-build:${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Tests
        uses: ./.github/actions/release-tests
        with:
          full-pipeline: ${{ steps.validation.outputs.release }}
          host-checks: ${{ steps.validation.outputs.checks }}
          policy: ${{ steps.validation.outputs.policy }}
          version: ${{ steps.version.outputs.version }}
          commit: ${{ steps.version.outputs.commit }}
          build-image: ghcr.io/capz/animaltown-build@${{ steps.image.outputs.digest }}
      - name: Build
        if: steps.validation.outputs.release == 'true'
        env:
          ANIMALTOWN_BUILD_IMAGE: ghcr.io/capz/animaltown-build@${{ steps.image.outputs.digest }}
        run: docker compose -f build/compose.yml run --rm --pull always --no-deps builder pwsh -NoLogo -NoProfile -File tools/build-linux.ps1 -Target build
      - name: Release
        if: steps.validation.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANIMALTOWN_BUILD_IMAGE: ghcr.io/capz/animaltown-build@${{ steps.image.outputs.digest }}
        run: docker compose -f build/compose.yml run --rm --pull always --no-deps -e GH_TOKEN builder pwsh -NoLogo -NoProfile -File tools/build-linux.ps1 -Target publish
      - name: Stop disposable test database
        if: always() && (steps.validation.outputs.release == 'true' || steps.validation.outputs.checks == 'true')
        run: docker compose -f build/compose.yml down --volumes --remove-orphans
