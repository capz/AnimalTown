name: Build and release

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main, feat/river-coast-terrain, feat/cloud-shadows, feat/nuget-rendering-services, feat/building-interiors-journeys, fix/movement-terrain-cache, feat/sloped-river-banks, feat/cached-terrain-rotation, feat/villager-rim-object-shadows, feat/nkit-release-images]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  change-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Classify the change for versioning
        shell: pwsh
        env:
          CHANGE_TITLE: ${{ github.event.pull_request.title }}
        run: ./tools/check-change-title.ps1 -Title $env:CHANGE_TITLE
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve xx.yy.zz.bb version from integration history
        id: version
        shell: pwsh
        run: ./tools/write-version.ps1 -GitHubOutput $env:GITHUB_OUTPUT
      - name: Select checks affected since the previous release
        id: validation
        shell: pwsh
        run: ./tools/select-validation.ps1 -Full:($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') -GitHubOutput $env:GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
        if: steps.validation.outputs.release == 'true'
      - uses: docker/login-action@v3
        if: steps.validation.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish Linux toolchain image
        if: steps.validation.outputs.release == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./build
          file: ./build/Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          provenance: false
          tags: ghcr.io/capz/animaltown-build:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Build ISO/backend, run selected checks and package
        if: steps.validation.outputs.release == 'true'
        env:
          ANIMALTOWN_BUILD_IMAGE: ghcr.io/capz/animaltown-build@${{ steps.image.outputs.digest }}
        run: |
          if [ "$(jq -r '.backend' out/validation-plan.json)" = true ]; then
            docker compose -f build/compose.yml run --rm --pull always builder
          else
            docker compose -f build/compose.yml run --rm --pull always --no-deps builder
          fi
      - name: Package and publish GitHub prerelease
        if: steps.validation.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANIMALTOWN_BUILD_IMAGE: ghcr.io/capz/animaltown-build@${{ steps.image.outputs.digest }}
        run: docker compose -f build/compose.yml run --rm --pull always --no-deps -e GH_TOKEN builder pwsh -NoLogo -NoProfile -File tools/build-linux.ps1 -Target publish
      - name: Stop disposable test database
        if: always() && steps.validation.outputs.release == 'true'
        run: docker compose -f build/compose.yml down --volumes --remove-orphans
