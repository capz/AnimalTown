name: Baseline indoor-save control
on:
  push:
    branches: [ci/package-save-control]
permissions:
  contents: write
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare published baseline and emulator
        run: |
          mkdir -p out/base
          gh release download v0.6.3.28174414ed84 --repo "$GITHUB_REPOSITORY" --dir out/base --pattern 'AnimalTown-0.6.3.28174414ed84.iso' --pattern SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('out/base');name='AnimalTown-0.6.3.28174414ed84.iso'
          expected=next(s.split()[0] for s in (root/'SHA256SUMS.txt').read_text().splitlines() if s.split()[-1].lstrip('*')==name)
          h=hashlib.sha256()
          with (root/name).open('rb') as f:
              while b:=f.read(8*1024*1024):h.update(b)
          assert h.hexdigest()==expected
          p=Path('tools/iso-smoke.py');s=p.read_text()
          s=s.replace("def building_save():\n    save_menu()", "def building_save():\n    previous=committed_card_sequence(root/'MemoryCardA.USA.raw')\n    save_menu()")
          s=s.replace("if paper>150:", "if paper>150 and committed_card_sequence(root/'MemoryCardA.USA.raw')>previous:")
          p.write_text(s)
          PY
          docker build -t animaltown-control - <<'DOCKER'
          FROM debian:trixie
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb xauth ffmpeg python3 libxcb-cursor0 ca-certificates && rm -rf /var/lib/apt/lists/*
          DOCKER
      - name: Create a fresh baseline town
        run: |
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" -e LIBGL_ALWAYS_SOFTWARE=1 --mount type=bind,src="$PWD",dst=/work -w /work animaltown-control python3 tools/iso-smoke.py out/base/AnimalTown-0.6.3.28174414ed84.iso out/control-fixture --movement-profile --new-town --profile-seconds 5
      - name: Require a committed indoor save on the old packages
        run: |
          mkdir -p out/control-buildings
          cp out/control-fixture/MemoryCardA.USA.raw out/control-buildings/
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" -e LIBGL_ALWAYS_SOFTWARE=1 --mount type=bind,src="$PWD",dst=/work -w /work animaltown-control python3 tools/iso-smoke.py out/base/AnimalTown-0.6.3.28174414ed84.iso out/control-buildings --buildings
      - name: Publish diagnostic screenshots only
        if: always()
        run: |
          mkdir -p out/evidence
          python3 - <<'PY'
          import struct,json
          from pathlib import Path
          report={}
          for label in ['fixture','buildings']:
              b=Path('out/control-'+label+'/MemoryCardA.USA.raw').read_bytes()
              directory=max([b[8192:16384],b[16384:24576]],key=lambda x:struct.unpack_from('>H',x,0x1ffa)[0])
              bat=max([b[24576:32768],b[32768:40960]],key=lambda x:struct.unpack_from('>H',x,4)[0])
              records={}
              for at in range(0,127*64,64):
                  if directory[at:at+4]!=b'AMTE':continue
                  name=directory[at+8:at+40].split(b'\0')[0].decode();block,n=struct.unpack_from('>HH',directory,at+54);data=b''
                  for _ in range(n):
                      assert 5<=block<len(b)//8192;data+=b[block*8192:(block+1)*8192];block=struct.unpack_from('>H',bat,10+(block-5)*2)[0]
                  if data[:8]!=b'DNDSAVE1':continue
                  length,offset=struct.unpack_from('>II',data,8);p=data[offset:offset+length]
                  if p[:4]!=b'ATSP':continue
                  entry={'sequence':struct.unpack_from('<i',p,16)[0],'bytes':len(p)}
                  if name.startswith('AT-Player'):
                      f=list(struct.unpack_from('<53i',p,len(p)-4-53*4));entry['playerSpaceFacingTypes']=f[:11];entry['journeys']=[f[11+i*7:18+i*7] for i in range(6)];entry['playerFields']=list(struct.unpack_from('<27i',p,28))
                  if name.startswith('AT-Town'):
                      pos=48
                      for _ in range(2):
                          runs=struct.unpack_from('<i',p,pos)[0];pos+=4+4*runs
                      residents=[]
                      for _ in range(6):
                          x,z,n=struct.unpack_from('<iii',p,pos);pos+=12+4*n
                          px,pz=struct.unpack_from('<ii',p,pos);pos+=8;residents.append([x,z,px,pz])
                      entry['residents']=residents
                  records[name]=entry
              report[label]=records
          text=json.dumps(report,indent=2);print(text);Path('out/evidence/baseline-control-save-state.json').write_text(text+'\n')
          PY
          for image in out/control-buildings/*.png; do cp "$image" "out/evidence/baseline-control-$(basename "$image")"; done
          cp out/control-buildings/emulator.log out/evidence/baseline-control-emulator.log
          gh release upload v0.7.4.88149d5aaab7 --repo "$GITHUB_REPOSITORY" out/evidence/* --clobber
