name: Villager attention bubbles
on:
  push:
    branches: [feat/villager-attention-bubbles]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: attention-hud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dolphin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve matching release identity
        id: version
        shell: pwsh
        run: ./tools/write-version.ps1 -GitHubOutput $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare emulator
        run: |
          docker build -t animaltown-attention - <<'DOCKER'
          FROM debian:trixie
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb xauth ffmpeg python3 libxcb-cursor0 ca-certificates && rm -rf /var/lib/apt/lists/*
          DOCKER
      - name: Fetch and verify the matching full ISO
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out/attention-release
          for attempt in $(seq 1 100); do
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out/attention-release --clobber --pattern "AnimalTown-$VERSION.iso" --pattern "AnimalTown-tools-$VERSION.zip" --pattern version.json --pattern SHA256SUMS.txt; then break; fi
            test "$attempt" != 100
            sleep 15
          done
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('out/attention-release');meta=json.loads((root/'version.json').read_text())
          assert meta['commit']==os.environ['GITHUB_SHA'] and not meta['dirty']
          name='AnimalTown-'+meta['version']+'.iso';iso=root/name
          assert iso.stat().st_size==1459978240
          expected=next(s.split()[0] for s in (root/'SHA256SUMS.txt').read_text().splitlines() if s.split()[-1].lstrip('*')==name)
          h=hashlib.sha256()
          with iso.open('rb') as f:
              while b:=f.read(8*1024*1024):h.update(b)
          assert h.hexdigest().lower()==expected.lower()
          Path('out/attention-iso.txt').write_text(str(iso))
          PY
      - name: Make disposable attention fixtures with matching tools
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import zipfile,hashlib,os
          root=Path('out/attention-release');name='AnimalTown-tools-'+os.environ['VERSION']+'.zip'
          expected=next(s.split()[0] for s in (root/'SHA256SUMS.txt').read_text().splitlines() if s.split()[-1]==name)
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected
          with zipfile.ZipFile(root/name) as z:z.extractall('out/attention-tools')
          PYFIX
          DAY=$(python3 -c 'from datetime import datetime,timezone;print(int((datetime(2026,11,9,12,tzinfo=timezone.utc).timestamp()-21600)//86400))')
          dotnet out/attention-tools/AnimalTown.Tools.dll attention-fixture "$PWD" out/attention-ready.gci "$DAY"
          dotnet out/attention-tools/AnimalTown.Tools.dll attention-fixture "$PWD" out/attention-deadline.gci "$((DAY-1))" deadline
      - name: Inspect independent bubbles, movement, dialogue and save/reload
        run: |
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" -e LIBGL_ALWAYS_SOFTWARE=1 --mount type=bind,src="$PWD",dst=/work -w /work animaltown-attention python3 tools/iso-smoke.py "$(cat out/attention-iso.txt)" out/attention-ready --villager-attention --attention-gci out/attention-ready.gci
          cp out/attention-ready/villager-attention.txt out/attention-ready/first-run-report.txt
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" -e LIBGL_ALWAYS_SOFTWARE=1 --mount type=bind,src="$PWD",dst=/work -w /work animaltown-attention python3 tools/iso-smoke.py "$(cat out/attention-iso.txt)" out/attention-ready --villager-attention --attention-reload
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)" -e LIBGL_ALWAYS_SOFTWARE=1 --mount type=bind,src="$PWD",dst=/work -w /work animaltown-attention python3 tools/iso-smoke.py "$(cat out/attention-iso.txt)" out/attention-deadline --villager-attention --attention-deadline --attention-gci out/attention-deadline.gci
      - name: Publish visual evidence
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,hashlib
          root=Path('out/attention-evidence');root.mkdir(parents=True,exist_ok=True)
          for label in ['ready','deadline']:
              for p in Path('out/attention-'+label).glob('*'):
                  if p.suffix in ['.png','.txt'] or p.name=='emulator.log':shutil.copy2(p,root/('attention-'+label+'-'+p.name))
          lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(root.iterdir())]
          (root/'attention-hud-SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
          if [ -n "$TAG" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" out/attention-evidence/* --clobber; fi
