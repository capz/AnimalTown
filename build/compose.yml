name: animaltown-build
services:
  builder:
    image: ${ANIMALTOWN_BUILD_IMAGE:-animaltown-builder:local}
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      ANIMALTOWN_TEST_CONNECTION: Host=database;Port=5432;Database=postgres;Username=postgres;Password=animaltown-test-only
      ANIMALTOWN_BUILD_IMAGE: ${ANIMALTOWN_BUILD_IMAGE:-animaltown-builder:local}
      ANIMALTOWN_VERSION_BUILD_KIND: ${ANIMALTOWN_VERSION_BUILD_KIND:-}
      ANIMALTOWN_VERSION_MAIN_REF: ${ANIMALTOWN_VERSION_MAIN_REF:-}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_PASSWORD: animaltown-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
